<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendientes | Lista de tareas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="hero">
    <img src="img/banner.png" alt="Ilustración de una lista de tareas" width="1600" height="500">
    <h1>Pendientes</h1>
  </header>

  <main class="panel">
    <form id="form" autocomplete="off">
      <label for="texto" class="sr">Nueva tarea</label>
      <input id="texto" type="text" placeholder="¿Qué tienes que hacer?" maxlength="80" required>
      <button type="submit">Agregar tarea</button>
    </form>

    <p id="resumen" class="resumen" aria-live="polite"></p>

    <ul id="lista"></ul>
    <p id="vacio" class="vacio" hidden>No hay tareas. Escribe una arriba para empezar.</p>

    <div class="filtros" role="group" aria-label="Filtrar tareas">
      <button type="button" data-filtro="todas" class="activo">Todas</button>
      <button type="button" data-filtro="pendientes">Pendientes</button>
      <button type="button" data-filtro="hechas">Hechas</button>
      <button type="button" id="limpiar">Borrar hechas</button>
    </div>
  </main>

  <footer>Reto de despliegue web · Tus tareas se guardan en este navegador</footer>
  <script src="js/app.js"></script>
</body>
</html>
