<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs"

    # Mapeo de directorio: la URL /tuapp apunta a la carpeta de la app
    Alias /tuapp "C:/xampp/sites/tuapp"

    <Directory "C:/xampp/sites/tuapp">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog "logs/tuapp-error.log"
    CustomLog "logs/tuapp-access.log" combined
</VirtualHost>
